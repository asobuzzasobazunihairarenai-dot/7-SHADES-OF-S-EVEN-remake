<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ダッシュボード - 7 SHADES OF S:EVEN</title>
<!-- ユーザー要望「登録ユーザーの一覧・ログイン履歴は小さい窓だと見にくいので独自の
     ウインドウを立ち上げてほしい」への対応。管理者モードのパネルとは別に、専用の
     静的ページとして独立させた（admin.jsから window.open() で開く）。ゲーム本体
     （src/main.js以下の巨大なモジュール群）は一切読み込まず、このページ専用の
     軽量なsrc/admin-dashboard.jsだけで完結させる。Supabaseの認証セッションは
     同じオリジンのlocalStorageで共有されるため、ゲーム画面で既にログイン済みの
     管理者アカウントなら、このページでも改めてログインし直す必要はない。 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="src/admin-dashboard.css">
</head>
<body>
  <div id="dashboard-root">
    <h1>🔐 管理者ダッシュボード</h1>
    <div id="dashboard-status">読み込み中...</div>
    <div id="dashboard-content" style="display: none;">
      <section>
        <h2>📣 全員へのお知らせ</h2>
        <div class="dashboard-hint">
          ここに書いた内容は、プレイヤーが<b>ホーム画面を開いた時に一度だけ</b>モーダルで表示されます
          （既読は端末ごとに記録されるので、同じお知らせが何度も出ることはありません）。
          新しく投稿すると、それが最新のお知らせになります。
        </div>
        <div id="announce-form">
          <input id="announce-title" type="text" maxlength="80" placeholder="見出し（例: サーバーメンテナンスのお知らせ）">
          <textarea id="announce-body" rows="5" maxlength="2000" placeholder="本文（改行はそのまま表示されます）"></textarea>
          <div class="announce-actions">
            <button id="announce-post-btn" type="button">この内容で全員に知らせる</button>
            <label class="announce-push-label">
              <input id="announce-push" type="checkbox">
              プッシュ通知でも送る（アプリを開いていなくても届きますが、通知を許可した人だけです）
            </label>
            <span id="announce-status" class="dashboard-hint"></span>
          </div>
        </div>
        <div class="dashboard-table-wrap">
          <table id="announce-table">
            <thead>
              <tr>
                <th>日時</th>
                <th>見出し</th>
                <th>本文</th>
                <th>状態</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="announce-tbody"></tbody>
          </table>
        </div>
      </section>
      <section>
        <h2>登録ユーザー一覧</h2>
        <div id="user-list-status" class="dashboard-hint"></div>
        <div class="dashboard-table-wrap">
          <table id="user-list-table">
            <thead>
              <tr>
                <th>表示名</th>
                <th>メールアドレス</th>
                <th>登録日時</th>
                <th>最終アクセス</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button id="user-list-show-all-btn" type="button" style="display: none;">すべて表示</button>
      </section>
      <section>
        <h2>ログイン履歴（訪問記録）</h2>
        <div id="visit-log-status" class="dashboard-hint"></div>
        <div class="dashboard-table-wrap">
          <table id="visit-log-table">
            <thead>
              <tr>
                <th>日時</th>
                <th>表示名</th>
                <th>メールアドレス</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button id="visit-log-more-btn" type="button">さらに読み込む</button>
      </section>
      <section>
        <h2>🐛 不具合報告</h2>
        <div id="bug-report-status" class="dashboard-hint"></div>
        <div class="dashboard-table-wrap">
          <table id="bug-report-table">
            <thead>
              <tr>
                <th>選択</th>
                <th>日時</th>
                <th>報告者</th>
                <th>内容</th>
                <th>画像</th>
                <th>詳細</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button id="bug-report-copy-selected-btn" type="button" disabled>選択をまとめてコピー</button>
        <button id="bug-report-show-all-btn" type="button" style="display: none;">すべて表示</button>
      </section>
    </div>
  </div>
  <script type="module" src="src/admin-dashboard.js"></script>
</body>
</html>
