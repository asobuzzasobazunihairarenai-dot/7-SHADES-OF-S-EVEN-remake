    <path d="M92 48 L205 64 Q216 66 214 77 L198 190 Q196 201 185 199 L72 183 Q61 181 63 170 L79 57 Q81 46 92 48 Z"
          fill="#16191F" stroke="#F4F7FB" stroke-width="10"/>

    <!-- 手前の白い正方形カード -->
